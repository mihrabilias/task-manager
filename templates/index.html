<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Aufgabenverwaltung</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md z-10 shrink-0">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                Aufgabenverwaltung
            </h1>
            
            <!-- Search and Filter -->
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <div class="relative">
                    <svg class="w-5 h-5 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="searchInput" placeholder="Suchen..." class="pl-10 pr-4 py-2 rounded-lg text-slate-800 w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-indigo-300">
                </div>
                <select id="filterStatus" class="px-4 py-2 rounded-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-300">
                    <option value="">Alle Status</option>
                    <option value="Offen">🔴 Offen</option>
                    <option value="In Bearbeitung">🟡 In Bearbeitung</option>
                    <option value="Erledigt">🟢 Erledigt</option>
                </select>
                <button onclick="openModal()" class="bg-white text-indigo-600 font-semibold px-4 py-2 rounded-lg shadow hover:bg-indigo-50 transition-colors whitespace-nowrap">
                    + Neue Aufgabe
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8">
        <div class="container mx-auto">
            <!-- Kanban Board Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="taskBoard">
                <!-- Column: Offen -->
                <div class="flex flex-col gap-4">
                    <h2 class="font-bold text-lg text-slate-700 flex items-center gap-2 border-b pb-2">
                        <span class="w-3 h-3 rounded-full bg-red-500"></span> Offen 
                        <span id="count-offen" class="ml-auto bg-slate-200 text-slate-600 text-xs py-1 px-2 rounded-full">0</span>
                    </h2>
                    <div id="col-offen" class="flex flex-col gap-3 min-h-[200px]"></div>
                </div>

                <!-- Column: In Bearbeitung -->
                <div class="flex flex-col gap-4">
                    <h2 class="font-bold text-lg text-slate-700 flex items-center gap-2 border-b pb-2">
                        <span class="w-3 h-3 rounded-full bg-yellow-400"></span> In Bearbeitung
                        <span id="count-bearbeitung" class="ml-auto bg-slate-200 text-slate-600 text-xs py-1 px-2 rounded-full">0</span>
                    </h2>
                    <div id="col-bearbeitung" class="flex flex-col gap-3 min-h-[200px]"></div>
                </div>

                <!-- Column: Erledigt -->
                <div class="flex flex-col gap-4">
                    <h2 class="font-bold text-lg text-slate-700 flex items-center gap-2 border-b pb-2">
                        <span class="w-3 h-3 rounded-full bg-green-500"></span> Erledigt
                        <span id="count-erledigt" class="ml-auto bg-slate-200 text-slate-600 text-xs py-1 px-2 rounded-full">0</span>
                    </h2>
                    <div id="col-erledigt" class="flex flex-col gap-3 min-h-[200px]"></div>
                </div>
            </div>
            
            <!-- Loading & Empty States -->
            <div id="loadingState" class="text-center py-10 text-slate-500 hidden">Lade Aufgaben...</div>
            <div id="emptyState" class="text-center py-10 text-slate-500 hidden">Keine Aufgaben gefunden.</div>
        </div>
    </main>

    <!-- Task Modal (Add / Edit) -->
    <div id="taskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="glass-panel w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden fade-in">
            <div class="bg-indigo-600 px-6 py-4 flex justify-between items-center">
                <h3 id="modalTitle" class="text-white text-xl font-semibold">Neue Aufgabe</h3>
                <button onclick="closeModal()" class="text-white/80 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="taskForm" class="p-6 flex flex-col gap-4">
                <input type="hidden" id="taskId">
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Titel *</label>
                    <input type="text" id="taskTitle" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Beschreibung</label>
                    <textarea id="taskDesc" rows="3" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Priorität</label>
                        <select id="taskPriority" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="Niedrig">🟢 Niedrig</option>
                            <option value="Mittel" selected>🟡 Mittel</option>
                            <option value="Hoch">🔴 Hoch</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
                        <select id="taskStatus" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="Offen">Offen</option>
                            <option value="In Bearbeitung">In Bearbeitung</option>
                            <option value="Erledigt">Erledigt</option>
                        </select>
                    </div>
                </div>
                
                <div class="mt-4 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2 rounded-lg font-medium text-slate-600 hover:bg-slate-100 transition">Abbrechen</button>
                    <button type="submit" class="px-5 py-2 rounded-lg font-medium bg-indigo-600 text-white hover:bg-indigo-700 shadow-md transition">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="glass-panel w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden p-6 text-center fade-in">
            <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2">Aufgabe löschen?</h3>
            <p class="text-slate-600 mb-6">Möchtest du diese Aufgabe wirklich löschen? Dieser Vorgang kann nicht rückgängig gemacht werden.</p>
            <div class="flex justify-center gap-3">
                <button onclick="closeConfirmModal()" class="px-5 py-2 rounded-lg font-medium text-slate-600 hover:bg-slate-100 transition w-full">Abbrechen</button>
                <button id="confirmDeleteBtn" class="px-5 py-2 rounded-lg font-medium bg-red-500 text-white hover:bg-red-600 shadow-md transition w-full">Löschen</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-3">
        <span id="toastIcon">✅</span>
        <span id="toastMessage">Erfolgreich gespeichert!</span>
    </div>

    <!-- Application Logic -->
    <script>
        // --- State Management ---
        let currentTasks = [];
        let taskToDeleteId = null;

        // --- DOM Elements ---
        const searchInput = document.getElementById('searchInput');
        const filterStatus = document.getElementById('filterStatus');
        const taskForm = document.getElementById('taskForm');
        
        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchTasks();
            
            // Event Listeners for filtering
            searchInput.addEventListener('input', debounce(fetchTasks, 300));
            filterStatus.addEventListener('change', fetchTasks);
            
            // Event Listener for form
            taskForm.addEventListener('submit', handleTaskSubmit);
        });

        // --- API Calls ---
        async function fetchTasks() {
            const search = searchInput.value;
            const status = filterStatus.value;
            
            toggleLoading(true);
            try {
                const response = await fetch(`/api/tasks?search=${encodeURIComponent(search)}&status=${encodeURIComponent(status)}`);
                const tasks = await response.json();
                currentTasks = tasks;
                renderTasks();
            } catch (error) {
                showToast('Fehler beim Laden der Aufgaben', '❌');
            } finally {
                toggleLoading(false);
            }
        }

        async function handleTaskSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('taskId').value;
            const taskData = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDesc').value,
                priority: document.getElementById('taskPriority').value,
                status: document.getElementById('taskStatus').value
            };
            
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/tasks/${id}` : '/api/tasks';
            
            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(taskData)
                });
                
                if (response.ok) {
                    showToast(id ? 'Aufgabe aktualisiert' : 'Aufgabe erstellt');
                    closeModal();
                    fetchTasks();
                } else {
                    showToast('Fehler beim Speichern', '❌');
                }
            } catch (error) {
                showToast('Netzwerkfehler', '❌');
            }
        }

        async function deleteTask() {
            if (!taskToDeleteId) return;
            
            try {
                const response = await fetch(`/api/tasks/${taskToDeleteId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showToast('Aufgabe gelöscht');
                    closeConfirmModal();
                    fetchTasks();
                } else {
                    showToast('Fehler beim Löschen', '❌');
                }
            } catch (error) {
                showToast('Netzwerkfehler', '❌');
            }
        }

        // --- Rendering Logic ---
        function renderTasks() {
            const colOffen = document.getElementById('col-offen');
            const colBearbeitung = document.getElementById('col-bearbeitung');
            const colErledigt = document.getElementById('col-erledigt');
            
            // Clear columns
            colOffen.innerHTML = '';
            colBearbeitung.innerHTML = '';
            colErledigt.innerHTML = '';
            
            let countOffen = 0, countBearb = 0, countErledigt = 0;
            
            if (currentTasks.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('taskBoard').classList.add('hidden');
                updateCounters(0, 0, 0);
                return;
            } else {
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('taskBoard').classList.remove('hidden');
            }

            currentTasks.forEach(task => {
                const taskCard = createTaskCard(task);
                
                if (task.status === 'Offen') {
                    colOffen.insertAdjacentHTML('beforeend', taskCard);
                    countOffen++;
                } else if (task.status === 'In Bearbeitung') {
                    colBearbeitung.insertAdjacentHTML('beforeend', taskCard);
                    countBearb++;
                } else if (task.status === 'Erledigt') {
                    colErledigt.insertAdjacentHTML('beforeend', taskCard);
                    countErledigt++;
                }
            });
            
            updateCounters(countOffen, countBearb, countErledigt);
        }

        function createTaskCard(task) {
            const priorityColors = {
                'Hoch': 'text-red-600 bg-red-100',
                'Mittel': 'text-yellow-600 bg-yellow-100',
                'Niedrig': 'text-green-600 bg-green-100'
            };
            
            const pColor = priorityColors[task.priority] || priorityColors['Mittel'];
            
            // Escape HTML to prevent XSS
            const safeTitle = escapeHTML(task.title);
            const safeDesc = escapeHTML(task.description);
            
            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 hover:shadow-md transition-shadow fade-in group">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-semibold px-2 py-1 rounded-full ${pColor}">${task.priority}</span>
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editTask(${task.id})" class="text-slate-400 hover:text-indigo-600 transition" title="Bearbeiten">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </button>
                            <button onclick="openConfirmModal(${task.id})" class="text-slate-400 hover:text-red-500 transition" title="Löschen">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                    <h4 class="font-bold text-slate-800 mb-1 line-clamp-1" title="${safeTitle}">${safeTitle}</h4>
                    <p class="text-sm text-slate-500 line-clamp-2 min-h-[40px]">${safeDesc || '<i class="opacity-50">Keine Beschreibung</i>'}</p>
                </div>
            `;
        }

        function updateCounters(offen, bearb, erledigt) {
            document.getElementById('count-offen').innerText = offen;
            document.getElementById('count-bearbeitung').innerText = bearb;
            document.getElementById('count-erledigt').innerText = erledigt;
        }

        // --- Modals & Interactions ---
        function openModal(task = null) {
            const modal = document.getElementById('taskModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            if (task) {
                document.getElementById('modalTitle').innerText = 'Aufgabe bearbeiten';
                document.getElementById('taskId').value = task.id;
                document.getElementById('taskTitle').value = task.title;
                document.getElementById('taskDesc').value = task.description;
                document.getElementById('taskPriority').value = task.priority;
                document.getElementById('taskStatus').value = task.status;
            } else {
                document.getElementById('modalTitle').innerText = 'Neue Aufgabe';
                taskForm.reset();
                document.getElementById('taskId').value = '';
            }
            
            // Focus title input
            setTimeout(() => document.getElementById('taskTitle').focus(), 100);
        }

        function closeModal() {
            const modal = document.getElementById('taskModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function editTask(id) {
            const task = currentTasks.find(t => t.id === id);
            if (task) openModal(task);
        }

        function openConfirmModal(id) {
            taskToDeleteId = id;
            const modal = document.getElementById('confirmModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Bind delete button dynamically
            document.getElementById('confirmDeleteBtn').onclick = deleteTask;
        }

        function closeConfirmModal() {
            taskToDeleteId = null;
            const modal = document.getElementById('confirmModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // --- Utilities ---
        function showToast(message, icon = '✅') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            document.getElementById('toastIcon').innerText = icon;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function toggleLoading(show) {
            const loader = document.getElementById('loadingState');
            if (show) loader.classList.remove('hidden');
            else loader.classList.add('hidden');
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
        
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }
    </script>
</body>
</html>
